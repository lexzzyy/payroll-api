<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>You're invited</title></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #333;">
  <h2 style="color: #1a1a1a;">You're invited to {{ organisation }}</h2>
  <p>{{ inviter }} has invited you to join <strong>{{ organisation }}</strong> as a <strong>{{ role }}</strong>.</p>
  <p style="margin: 30px 0;">
    <a href="{{ accept_url }}" style="background: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">
      Accept invitation
    </a>
  </p>
  <p style="color: #666; font-size: 14px;">Or copy this URL:<br>
    <a href="{{ accept_url }}" style="color: #2563eb; word-break: break-all;">{{ accept_url }}</a>
  </p>
  <p style="color: #666; font-size: 14px;">This invitation expires in 7 days. If you weren't expecting this, ignore this email.</p>
  <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
  <p style="color: #999; font-size: 12px;">— {{ organisation }}<br>{{ support_email }}</p>
</body>
</html>
